<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register patient · SpiroBuddy</title><link rel="stylesheet" href="css/styles.css"><style>.registration{max-width:760px;margin:auto}.registration label{display:grid;gap:6px}.registration form{display:grid;grid-template-columns:1fr 1fr;gap:18px}.registration input,.registration select,.registration textarea{width:100%;min-height:44px}.full{grid-column:1/-1}@media(max-width:600px){.registration form{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header id="app-header"></header><main id="main"><div class="registration"><h1>Register a patient</h1><p>Use the hospital's own registration number. The prescription and patient login stay connected to this record.</p><form id="register-form" class="card"><label>Hospital registration number<input name="registration_no" required maxlength="40"></label><label>Full name<input name="name" required maxlength="120"></label><label>Age<input name="age" type="number" min="0" max="120" required></label><label>Sex<select name="sex"><option value="M">Male</option><option value="F">Female</option><option value="O">Other</option></select></label><label>Registered phone number<input name="phone" type="tel" maxlength="24" placeholder="+91 followed by phone digits"><small>Leave blank if pending. OTP uses this number.</small></label><label>Language<select name="language"><option value="en">English</option><option value="hi">Hindi</option><option value="ta">Tamil</option><option value="ml">Malayalam</option></select></label><label>Responsible doctor<select name="primary_doctor_id" id="doctor" required></select></label><label>Ward<input name="ward" maxlength="80"></label><label>Bed (if assigned)<input name="bed" maxlength="40"><small>Location only. Bed occupancy management is planned.</small></label><label>Condition / reason for care<input name="condition" maxlength="300"></label><label class="full">Allergies or relevant information<textarea name="allergies_text" maxlength="500"></textarea></label><p id="error" class="full" role="alert" hidden></p><button class="btn primary full" id="save" type="submit">Register patient</button></form><section id="result" class="card" hidden></section></div></main><script src="js/icons.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script><script>
(() => {const $=s=>document.querySelector(s),esc=SB.ui.esc;SB.ui.boot('register').then(async()=>{try{const d=await SB.api.get('/api/registration/options');d.doctors.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name;$('#doctor').append(o);});}catch(e){$('#error').hidden=false;$('#error').textContent=e.message;$('#save').disabled=true;}});$('#register-form').onsubmit=async e=>{e.preventDefault();$('#save').disabled=true;$('#error').hidden=true;try{const b=Object.fromEntries(new FormData(e.target));const d=await SB.api.post('/api/patients',b);$('#register-form').hidden=true;$('#result').hidden=false;$('#result').innerHTML=`<h2>${esc(d.patient.name)} registered</h2><p>Hospital number: <strong>${esc(d.registration_no)}</strong></p><p>${d.patient.phone?'Registered phone saved.':'Phone number pending. Staff can continue care.'}</p><a class="btn primary" href="patient.html?id=${d.patient.id}">Open patient record</a> <a class="btn" href="prescribe.html?id=${d.patient.id}">Write prescription</a><p>Patient login: <a href="${esc(d.login_path)}">Hospital number + OTP</a></p><p>Personal link (shown once): <a href="${esc(d.app_link)}">Open patient app</a></p>`;}catch(e){$('#error').hidden=false;$('#error').textContent=e.message;}finally{$('#save').disabled=false;}};})();
</script>
<script>
const breathingLabel=document.createElement('label');breathingLabel.className='full';breathingLabel.innerHTML='<span><input type="checkbox" name="breathing_enabled" style="width:auto;min-height:auto"> Assign the breathing exercise module (simulated input)</span>';document.querySelector('#save').before(breathingLabel);
</script></body></html>
