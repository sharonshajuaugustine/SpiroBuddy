<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discharge care document</title><link rel="stylesheet" href="css/discharge-docs.css"></head><body><main><nav><a href="dashboard.html">Staff dashboard</a><a id="chart">Patient record</a></nav><h1>Discharge care document</h1><p id="identity" class="meta"></p><p class="notice">Enter the clinician's documented instructions. Publishing makes this document visible to the patient. It does not discharge a bed or issue medicines.</p><p id="error" role="alert"></p><div id="controls"><button id="new">Create replacement / new draft</button></div><form id="editor" hidden><section><label>Document language<input name="language" maxlength="40" value="en" required></label><label>Condition summary<textarea name="condition_summary" maxlength="4000" required></textarea></label><label>Treatment / course summary<textarea name="treatment_summary" maxlength="4000"></textarea></label><label>Home-care instructions<textarea name="home_care" maxlength="4000" required></textarea></label><label>Warning signs and action to take<textarea name="warning_signs" maxlength="4000"></textarea></label><label>Follow-up instructions<textarea name="follow_up" maxlength="4000" required></textarea></label><label>Optional follow-up date<input name="follow_up_date" type="date"></label><label>Optional discharge date<input name="discharge_date" type="date"></label><label>Documented SpiroBuddy exercise instructions<textarea name="exercise_instructions" maxlength="4000"></textarea><small>Copy documented guidance only. This does not set an exercise prescription.</small></label><button type="submit">Save draft</button><button id="preview" type="button">Preview saved draft</button><button id="publish" type="button">Publish saved draft to patient</button></section></form><section id="current"></section><section><h2>Document history</h2><div id="history"></div></section></main><script src="js/discharge-editor.js"></script></body></html>
