<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My medicines · SpiroBuddy</title>
  <meta name="description" content="Your doctor's prescription on your phone (sample patient).">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6e8a'/%3E%3Crect x='9' y='13' width='6' height='13' rx='3' fill='%23fff'/%3E%3Cpath d='M19 12c3 0 3 4 6 4M19 18c3 0 3 4 6 4' stroke='%237fe0c8' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/meds.css">
</head>
<body class="g-body m-body">
  <div class="m-wrap">
    <div id="brand-slot" hidden></div>
    <header class="g-top">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0b6e8a"/><rect x="9" y="6" width="6" height="20" rx="3" fill="#fff" opacity=".35"/><rect x="9" y="13" width="6" height="13" rx="3" fill="#fff"/><path d="M19 12c3 0 3 4 6 4M19 18c3 0 3 4 6 4" stroke="#7fe0c8" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
      <div class="t">SpiroBuddy<small id="m-title">My medicines</small></div>
    </header>
    <div id="m-ribbon" class="m-ribbon"></div>
    <div class="g-lang" id="m-lang" role="group" aria-label="Language"></div>

    <main id="m-main" tabindex="-1" aria-live="polite"><div class="m-card m-empty"><span class="skeleton" style="height:28px;width:60%;margin:0 auto 12px"></span><span class="skeleton" style="height:72px"></span></div></main>

    <p class="m-foot" id="m-foot"></p>
    <div class="m-status" id="m-status" aria-labelledby="m-status-h">
      <span id="m-status-h" class="sr-only"></span>
      <span><span data-i="fPhone"></span> <span data-feature="rx.patient_phone"></span></span>
      <span><span data-i="fPharmacy"></span> <span data-feature="rx.pharmacy_screen"></span></span>
      <span><span data-i="fQr"></span> <span data-feature="rx.verify_qr"></span></span>
    </div>

    <!-- the full-screen pharmacy card: white, like paper -->
    <div id="m-pharmacy" class="rxc-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="rxc-bar-t"></div>
  </div>

  <script src="js/branding.js" defer></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/meds-core.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/meds-patient.js"></script>
</body>
</html>
