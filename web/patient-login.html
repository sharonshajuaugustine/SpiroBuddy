<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patient login · SpiroBuddy</title>
  <meta name="description" content="Log in to see your medicines with the registration number from your hospital slip and a 6-digit PIN (sample patients).">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6e8a'/%3E%3Crect x='9' y='13' width='6' height='13' rx='3' fill='%23fff'/%3E%3Cpath d='M19 12c3 0 3 4 6 4M19 18c3 0 3 4 6 4' stroke='%237fe0c8' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/patient-login.css">
</head>
<body class="g-body pl-body">
  <div class="pl-wrap">
    <header class="g-top">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0b6e8a"/><rect x="9" y="6" width="6" height="20" rx="3" fill="#fff" opacity=".35"/><rect x="9" y="13" width="6" height="13" rx="3" fill="#fff"/><path d="M19 12c3 0 3 4 6 4M19 18c3 0 3 4 6 4" stroke="#7fe0c8" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
      <div class="t">SpiroBuddy<small id="pl-sub">Patient login</small></div>
    </header>
    <div class="g-lang" id="pl-lang" role="group" aria-label="Language"></div>

    <main id="pl-main" tabindex="-1">
      <section class="pl-card" aria-labelledby="pl-h">
        <h1 id="pl-h" class="pl-h">Log in</h1>
        <p class="pl-lead" id="pl-lead"></p>
        <div class="pl-msg bad" id="pl-error" role="alert" hidden></div>
        <form id="pl-form" novalidate>
          <div class="pl-field">
            <label for="pl-no" id="pl-no-l"></label>
            <input id="pl-no" name="registration_no" type="text" inputmode="text" autocomplete="username" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="next" maxlength="40" aria-describedby="pl-no-h">
            <p class="pl-hint" id="pl-no-h"></p>
          </div>
          <div class="pl-field">
            <label for="pl-pin" id="pl-pin-l"></label>
            <div class="pl-pinrow">
              <input id="pl-pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="9" enterkeyhint="go" aria-describedby="pl-pin-h">
              <button type="button" class="pl-show" id="pl-show" aria-controls="pl-pin" aria-pressed="false"></button>
            </div>
            <p class="pl-hint" id="pl-pin-h"></p>
          </div>
          <button class="pl-btn" id="pl-go" type="submit"></button>
        </form>
      </section>

      <!-- Shown only when the server says DEMO_MODE; the number and PIN come from the server, never from this page. -->
      <section class="pl-demo" id="pl-demo" aria-labelledby="pl-demo-h" hidden></section>

      <p class="pl-help" id="pl-help"></p>
      <p class="pl-help"><a id="pl-staff" href="login.html"></a></p>
    </main>

    <p class="pl-foot" id="pl-foot"></p>
    <p class="pl-status"><span id="pl-fl"></span> <span data-feature="auth.patient_regno"></span></p>
  </div>
  <noscript><p class="pl-foot">This page needs JavaScript. Please turn it on and reload.</p></noscript>

  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/patient-login.js"></script>
</body>
</html>
