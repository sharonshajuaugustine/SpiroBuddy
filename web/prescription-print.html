<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prescription · SpiroBuddy</title><style>body{font:18px Arial,sans-serif;color:#172b40;margin:24px}main{max-width:800px;margin:auto}article{margin:24px 0;padding:24px;border:1px solid #bdc7d0}h1{font-size:28px}h2{font-size:24px}li{margin:20px 0;line-height:1.5}button,a{font:inherit;min-height:48px;padding:12px}small{display:block;color:#4b5d6f}@media print{.actions{display:none}article{break-after:page;border:0}article:last-child{break-after:auto}body{margin:0;font-size:12pt}@page{size:A4;margin:18mm}}</style></head><body><main><div class="actions"><button id="print" disabled>Print / Save as PDF</button> <a href="meds.html">My medicines</a></div><p id="error" role="alert"></p><div id="cards"></div></main><script src="js/meds-core.js"></script><script>
(() => {const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.querySelector('#print').onclick=()=>window.print();fetch('/api/me/prescription-card',{credentials:'same-origin',cache:'no-store'}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||'Patient login needed');const cards=d.cards||[];document.querySelector('#cards').innerHTML=cards.length?cards.map(c=>`<article><h1>${esc(c.hospital.name)}</h1><h2>Prescription</h2><p><strong>${esc(c.patient.name)}</strong> · ${esc(c.patient.age)} years · ${esc(c.patient.sex)}</p><p>Doctor: ${esc(c.doctor.name)}<br>Doctor registration: ${esc(c.doctor.reg_no_display||'Not recorded')}<br>Issued: ${esc(c.issued_on)}</p><ol>${c.lines.map(l=>`<li><strong>${esc(l.drug_name)} ${esc(l.strength||'')}</strong><br>${esc(SB.meds.summary(l)||'See doctor instructions')}${l.end_date&&!l.duration_days&&!l.until_stopped?'<br>Until '+esc(SB.meds.dateText(l.end_date,'en')):''}<br>${esc(l.instructions||'')}</li>`).join('')}</ol><small>Check the hospital copy: ${esc(location.origin+c.verify_path)}</small><p>${esc(c.notice||'Sample prescription. Not for dispensing.')}</p></article>`).join(''):'<p>No current prescription.</p>';document.querySelector('#print').disabled=!cards.length;}).catch(e=>{document.querySelector('#error').textContent=e.message;});})();
</script></body></html>
