<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 646" width="1000" height="646" font-family="Segoe UI, Nirmala UI, Noto Sans, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">SpiroBuddy 2.0 architecture</title>
<desc id="d">Browser apps (patient app, family page, hospital software, public site, 3D twin) talk to one FastAPI web service, which reads and writes the store (database, file storage, audit log, AI register) and calls outside services (Gemini, Anthropic, Sarvam, WhatsApp and calls, a records network), each with an offline backup. The device link (USB in development, Bluetooth planned, a simulator in the demo) feeds the patient app. The prescription path runs from the doctor to the patient's phone to the pharmacy counter. Every box carries its status word. Fake patients only. Statuses as of the date this file was generated, from backend/app/features.py.</desc>
<style>
.box rect{fill:#f8fafb;stroke:#c3ccd5;stroke-width:1.5}
.box.s-live rect{fill:#e8f5ec;stroke:#2e9d4e}
.box.s-simulated rect{fill:#e4f1f5;stroke:#0b6e8a}
.box.s-in_development rect{fill:#eef2f5;stroke:#5b6878;stroke-width:2}
.box.s-planned rect{fill:#ffffff;stroke:#c3ccd5;stroke-dasharray:6 4}
.box .t{fill:#101c27;font-size:13px;font-weight:650}
.box .st{fill:#445263;font-size:11px;font-weight:700}
.zone{fill:none;stroke:#c3ccd5;stroke-width:1;stroke-dasharray:3 4}
.zone-t{fill:#5b6878;font-size:11px;font-weight:700;letter-spacing:.04em}
.link{stroke:#5b6878;stroke-width:1.6;fill:none}.link.dashed{stroke-dasharray:5 4}
.arrow{fill:#5b6878}.lk{fill:#5b6878;font-size:10.5px}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1319}
.box rect{fill:#1a2430;stroke:#3a4a5c}
.box.s-live rect{fill:#13301d;stroke:#4cc06d}
.box.s-simulated rect{fill:#12303d;stroke:#3fb4d4}
.box.s-in_development rect{fill:#202c39;stroke:#95a2b0}
.box.s-planned rect{fill:#151d26;stroke:#3a4a5c}
.box .t{fill:#e8eef4}.box .st{fill:#b4c0cc}
.zone{stroke:#283544}.zone-t,.lk{fill:#95a2b0}.link{stroke:#95a2b0}.arrow{fill:#95a2b0}
.title-t{fill:#e8eef4}}
.bg{fill:#f4f6f8}.title-t{fill:#101c27;font-size:18px;font-weight:700}
</style>
<rect class="bg" width="1000" height="646"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="arrow" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect class="zone" x="10" y="44" width="240" height="338" rx="12"/><text class="zone-t" x="22" y="64">BROWSER APPS (NO INSTALL)</text><rect class="zone" x="275" y="44" width="250" height="338" rx="12"/><text class="zone-t" x="287" y="64">SERVER (FASTAPI, ONE WEB SERVICE)</text><rect class="zone" x="560" y="44" width="240" height="338" rx="12"/><text class="zone-t" x="572" y="64">STORE</text><rect class="zone" x="815" y="44" width="175" height="338" rx="12"/><text class="zone-t" x="827" y="64">OUTSIDE SERVICES</text><rect class="zone" x="10" y="410" width="340" height="196" rx="12"/><text class="zone-t" x="22" y="430">AT HOME: THE DEVICE LINK</text><rect class="zone" x="372" y="410" width="618" height="196" rx="12"/><text class="zone-t" x="384" y="430">THE PRESCRIPTION PATH, DOCTOR TO CHEMIST</text><path class="link" d="M240 200 L273 200" marker-end="url(#ah)"/><text class="lk" x="257" y="190" text-anchor="middle">HTTPS</text><path class="link" d="M525 200 L558 200" marker-end="url(#ah)"/><text class="lk" x="541" y="190" text-anchor="middle">reads, writes</text><path class="link dashed" d="M400 44 L400 24 L902 24 L902 42" marker-end="url(#ah)"/><text class="lk" x="650" y="18" text-anchor="middle">calls out, each with an offline backup</text><path class="link dashed" d="M125 410 L125 384" marker-end="url(#ah)"/><text class="lk" x="135" y="399" text-anchor="start">breath readings</text><path class="link" d="M522 510 L544 510" marker-end="url(#ah)"/><path class="link" d="M676 510 L698 510" marker-end="url(#ah)"/><path class="link" d="M830 510 L852 510" marker-end="url(#ah)"/><g class="box s-live" data-key="app.patient" role="img" aria-label="Patient app: Live"><title>Patient app (large text, no typing, no login): Live. Large text, voice and no typing: breathing coach, medicines, visits and papers.</title><rect x="20" y="74" width="210" height="48" rx="8"/><text class="t" x="125.0" y="92" text-anchor="middle">Patient app</text><text class="st" x="125.0" y="113" text-anchor="middle">Live</text></g><g class="box s-live" data-key="family.page" role="img" aria-label="Family page: Live"><title>Family page: Live. A private link. With the patient&#x27;s consent: today&#x27;s ticks.</title><rect x="20" y="136" width="210" height="48" rx="8"/><text class="t" x="125.0" y="154" text-anchor="middle">Family page</text><text class="st" x="125.0" y="175" text-anchor="middle">Live</text></g><g class="box s-in_development" data-key="chart.tabs" role="img" aria-label="Hospital software: In development"><title>Patient chart: In development. Doctor, nurse and admin: the triage list, the patient chart, prescriptions and visits.</title><rect x="20" y="198" width="210" height="48" rx="8"/><text class="t" x="125.0" y="216" text-anchor="middle">Hospital software</text><text class="st" x="125.0" y="237" text-anchor="middle">In development</text></g><g class="box s-live" data-key="public.landing" role="img" aria-label="Public story site: Live"><title>Public story site: Live. This site: landing, impact, trust, vision and architecture.</title><rect x="20" y="260" width="210" height="48" rx="8"/><text class="t" x="125.0" y="278" text-anchor="middle">Public story site</text><text class="st" x="125.0" y="299" text-anchor="middle">Live</text></g><g class="box s-in_development" data-key="twin.public" role="img" aria-label="3D twin and showroom: In development"><title>Public 3D twin: In development. A 3D model of the device that breathes on its own simulator.</title><rect x="20" y="322" width="210" height="48" rx="8"/><text class="t" x="125.0" y="340" text-anchor="middle">3D twin and showroom</text><text class="st" x="125.0" y="361" text-anchor="middle">In development</text></g><g class="box s-live" data-key="auth.staff_login" role="img" aria-label="Logins, permissions, audit: Live"><title>Staff login (email and password): Live. Staff logins, patient links, who may see which patient, and the audit writer.</title><rect x="290" y="74" width="220" height="48" rx="8"/><text class="t" x="400.0" y="92" text-anchor="middle">Logins, permissions, audit</text><text class="st" x="400.0" y="113" text-anchor="middle">Live</text></g><g class="box s-live" data-key="safety.red_flags" role="img" aria-label="Safety rules: Live"><title>Red-flag words reach a person: Live. Danger words get one fixed message. Medicine questions go to a person.</title><rect x="290" y="136" width="220" height="48" rx="8"/><text class="t" x="400.0" y="154" text-anchor="middle">Safety rules</text><text class="st" x="400.0" y="175" text-anchor="middle">Live</text></g><g class="box s-simulated" data-key="coach.classifier" role="img" aria-label="Breath model and coach: Simulated"><title>Breath labels and scores: Simulated. Labels and scores each breath. Fixed rules are the backup.</title><rect x="290" y="198" width="220" height="48" rx="8"/><text class="t" x="400.0" y="216" text-anchor="middle">Breath model and coach</text><text class="st" x="400.0" y="237" text-anchor="middle">Simulated</text></g><g class="box s-in_development" data-key="rx.patient_phone" role="img" aria-label="Prescription and doses: In development"><title>The doctor&#x27;s prescription on the patient&#x27;s phone: In development. Holds the doctor&#x27;s prescription and builds the patient&#x27;s medicine schedule.</title><rect x="290" y="260" width="220" height="48" rx="8"/><text class="t" x="400.0" y="278" text-anchor="middle">Prescription and doses</text><text class="st" x="400.0" y="299" text-anchor="middle">In development</text></g><g class="box s-simulated" data-key="comms.whatsapp" role="img" aria-label="Comms simulators: Simulated"><title>WhatsApp updates: Simulated. WhatsApp and phone-call previews, and the escalation ladder.</title><rect x="290" y="322" width="220" height="48" rx="8"/><text class="t" x="400.0" y="340" text-anchor="middle">Comms simulators</text><text class="st" x="400.0" y="361" text-anchor="middle">Simulated</text></g><g class="box s-live" data-key="tenancy.hospitals" role="img" aria-label="Database: Live"><title>Separate hospitals in one system: Live. Supabase (Postgres), or a local SQLite file for the demo. Every row carries its hospital.</title><rect x="575" y="74" width="210" height="48" rx="8"/><text class="t" x="680.0" y="92" text-anchor="middle">Database</text><text class="st" x="680.0" y="113" text-anchor="middle">Live</text></g><g class="box s-in_development" data-key="docs.vault" role="img" aria-label="File storage: In development"><title>Document vault: In development. Papers and prescription files, checked and cleaned, kept under random names.</title><rect x="575" y="136" width="210" height="48" rx="8"/><text class="t" x="680.0" y="154" text-anchor="middle">File storage</text><text class="st" x="680.0" y="175" text-anchor="middle">In development</text></g><g class="box s-live" data-key="audit.log" role="img" aria-label="Audit log: Live"><title>Audit log: Live. Who looked at or changed what, and when.</title><rect x="575" y="198" width="210" height="48" rx="8"/><text class="t" x="680.0" y="216" text-anchor="middle">Audit log</text><text class="st" x="680.0" y="237" text-anchor="middle">Live</text></g><g class="box s-in_development" data-key="ai.register" role="img" aria-label="AI register: In development"><title>AI register: In development. Every AI call as a reference with no content, plus the reviewer&#x27;s decision.</title><rect x="575" y="260" width="210" height="48" rx="8"/><text class="t" x="680.0" y="278" text-anchor="middle">AI register</text><text class="st" x="680.0" y="299" text-anchor="middle">In development</text></g><g class="box s-planned" data-key="db.rls_per_hospital" role="img" aria-label="Row security: Planned"><title>Postgres per-hospital row security: Planned. The database itself keeping hospitals apart.</title><rect x="575" y="322" width="210" height="48" rx="8"/><text class="t" x="680.0" y="340" text-anchor="middle">Row security</text><text class="st" x="680.0" y="361" text-anchor="middle">Planned</text></g><g class="box s-in_development" data-key="rx.ai_read" role="img" aria-label="Gemini: In development"><title>AI drafts a prescription from a photo: In development. Optional drafts from sample documents. A person confirms every line.</title><rect x="830" y="74" width="150" height="48" rx="8"/><text class="t" x="905.0" y="92" text-anchor="middle">Gemini</text><text class="st" x="905.0" y="113" text-anchor="middle">In development</text></g><g class="box s-live" data-key="ai.summary" role="img" aria-label="Anthropic: Live"><title>Daily summary text: Live. Daily summary text. A fixed template is the backup.</title><rect x="830" y="136" width="150" height="48" rx="8"/><text class="t" x="905.0" y="154" text-anchor="middle">Anthropic</text><text class="st" x="905.0" y="175" text-anchor="middle">Live</text></g><g class="box s-live" data-key="coach.voice" role="img" aria-label="Sarvam voice: Live"><title>Voice coach in 11 Indian languages: Live. Spoken coaching. Recorded clips and browser speech are the backups.</title><rect x="830" y="198" width="150" height="48" rx="8"/><text class="t" x="905.0" y="216" text-anchor="middle">Sarvam voice</text><text class="st" x="905.0" y="237" text-anchor="middle">Live</text></g><g class="box s-in_development" data-key="comms.whatsapp_real_send" role="img" aria-label="WhatsApp and calls: In development"><title>Real WhatsApp sending: In development. Twilio and Exotel. Real sending is not switched on.</title><rect x="830" y="260" width="150" height="48" rx="8"/><text class="t" x="905.0" y="278" text-anchor="middle">WhatsApp and calls</text><text class="st" x="905.0" y="299" text-anchor="middle">In development</text></g><g class="box s-planned" data-key="docs.abdm_link" role="img" aria-label="Records network: Planned"><title>ABDM link (view in your health locker): Planned. ABDM link to the patient&#x27;s health locker.</title><rect x="830" y="322" width="150" height="48" rx="8"/><text class="t" x="905.0" y="340" text-anchor="middle">Records network</text><text class="st" x="905.0" y="361" text-anchor="middle">Planned</text></g><g class="box s-in_development" data-key="device.usb" role="img" aria-label="Clip-on unit over USB: In development"><title>Clip-on unit over USB: In development. The unit on the spirometer, wired to the phone.</title><rect x="20" y="446" width="320" height="40" rx="8"/><text class="t" x="180.0" y="463" text-anchor="middle">Clip-on unit over USB</text><text class="st" x="180.0" y="477" text-anchor="middle">In development</text></g><g class="box s-planned" data-key="device.ble" role="img" aria-label="Bluetooth link: Planned"><title>Bluetooth pairing: Planned. Wireless pairing of the unit.</title><rect x="20" y="498" width="320" height="40" rx="8"/><text class="t" x="180.0" y="515" text-anchor="middle">Bluetooth link</text><text class="st" x="180.0" y="529" text-anchor="middle">Planned</text></g><g class="box s-simulated" data-key="coach.breath" role="img" aria-label="Breath simulator: Simulated"><title>Breathing coach: Simulated. What the demo uses in place of the unit.</title><rect x="20" y="550" width="320" height="40" rx="8"/><text class="t" x="180.0" y="567" text-anchor="middle">Breath simulator</text><text class="st" x="180.0" y="581" text-anchor="middle">Simulated</text></g><g class="box s-in_development" data-key="rx.manual" role="img" aria-label="Doctor types it in the hospital app: In development"><title>Doctor types the prescription: In development. No AI involved. This route always works.</title><rect x="392" y="478" width="130" height="64" rx="8"/><text class="t" x="457.0" y="500" text-anchor="middle">Doctor types it</text><text class="t" x="457.0" y="515" text-anchor="middle">in the hospital app</text><text class="st" x="457.0" y="533" text-anchor="middle">In development</text></g><g class="box s-in_development" data-key="rx.patient_phone" role="img" aria-label="Shows on the patient&#x27;s phone: In development"><title>The doctor&#x27;s prescription on the patient&#x27;s phone: In development. The doctor writes it; the patient sees every medicine at once.</title><rect x="546" y="478" width="130" height="64" rx="8"/><text class="t" x="611.0" y="500" text-anchor="middle">Shows on the</text><text class="t" x="611.0" y="515" text-anchor="middle">patient&#x27;s phone</text><text class="st" x="611.0" y="533" text-anchor="middle">In development</text></g><g class="box s-in_development" data-key="rx.pharmacy_screen" role="img" aria-label="Shown at the pharmacy counter: In development"><title>Show the prescription at the pharmacy counter: In development. A clear screen for the chemist instead of paper. Not yet tested with a real pharmacy.</title><rect x="700" y="478" width="130" height="64" rx="8"/><text class="t" x="765.0" y="500" text-anchor="middle">Shown at the</text><text class="t" x="765.0" y="515" text-anchor="middle">pharmacy counter</text><text class="st" x="765.0" y="533" text-anchor="middle">In development</text></g><g class="box s-in_development" data-key="rx.verify_qr" role="img" aria-label="Chemist scans a QR to check: In development"><title>Pharmacist scans a QR to check the prescription: In development. Opens the hospital&#x27;s copy to compare. No login; fake patients only.</title><rect x="854" y="478" width="130" height="64" rx="8"/><text class="t" x="919.0" y="500" text-anchor="middle">Chemist scans</text><text class="t" x="919.0" y="515" text-anchor="middle">a QR to check</text><text class="st" x="919.0" y="533" text-anchor="middle">In development</text></g><g class="box s-live"><rect x="12" y="616" width="26" height="16" rx="4"/></g><text class="lk" x="46" y="628" style="font-size:12px">Live</text><g class="box s-simulated"><rect x="100" y="616" width="26" height="16" rx="4"/></g><text class="lk" x="134" y="628" style="font-size:12px">Simulated</text><g class="box s-in_development"><rect x="223" y="616" width="26" height="16" rx="4"/></g><text class="lk" x="257" y="628" style="font-size:12px">In development</text><g class="box s-planned"><rect x="381" y="616" width="26" height="16" rx="4"/></g><text class="lk" x="415" y="628" style="font-size:12px">Planned</text>
</svg>
