<title id="t">How SpiroBuddy works – architecture</title>
<desc id="d">Laser base (in development) and breath simulator (simulated) feed the patient phone web app (live), which talks to the SpiroBuddy server on Render (live) with a Supabase database in Mumbai. The server holds the breath model, voice coach, daily summaries and fixed safety rules, and feeds the nurse dashboard, the family page and WhatsApp and phone messages (previews today). Planned items are listed at the bottom. Fake patients only.</desc>
